name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Suite de tests
        # Les données proviennent du générateur synthétique : aucun
        # téléchargement, donc aucune dépendance à un service tiers.
        run: pytest -v

      - name: Pipeline de bout en bout
        run: |
          taxieta make-data --rows 120000 --out /tmp/trips.parquet
          taxieta train --data /tmp/trips.parquet --out /tmp/model.joblib
          taxieta predict --data /tmp/trips.parquet --model /tmp/model.joblib \
            --mode parquet --out /tmp/preds
          taxieta bench --data /tmp/trips.parquet --model /tmp/model.joblib --partitions 4
